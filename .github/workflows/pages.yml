# Publiserer siden på GitHub Pages med den felles publiseringen i publiser.yml
# (samme fil brukes av byguider og reiseplanlegging):
#   main                -> stam.pe/
#   alle andre grener   -> stam.pe/forhandsvisning/<gren>/

name: Publiser

on:
  push:
  delete:
  workflow_dispatch:

jobs:
  publiser:
    uses: ./.github/workflows/publiser.yml
    permissions:
      actions: write
      contents: read
      pages: write
      id-token: write
      deployments: read
